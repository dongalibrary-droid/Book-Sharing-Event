<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="동아대학교 도서관 도서 나눔 로그인" />
  <title>로그인 | 동아대학교 도서관 도서 나눔</title>
  <link rel="icon" href="assets/images/search-icon-05.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css?v=20260907-4" />
</head>
<body data-page="login">
  <script>
    window.CAREER_BOOKS_CONFIG = {
      appsScriptUrl: "https://script.google.com/macros/s/AKfycbxQrpdAeaKGvu-27715evDBXFt12FP6ooytHYzLt1wN_pWMdPyy47GGPgZQwESDbD7X/exec",
      dataUrl: "assets/data/career-books.json?v=20260907-4"
    };
  </script>
  <header class="site-header">
    <div class="top-strip"><span>Dong-A University Library</span><span>80th Anniversary</span></div>
    <div class="brand-row">
      <a href="index.html"><img class="library-logo" src="assets/images/black-logo.png" alt="동아대학교 도서관" /></a>
      <img class="anniversary-logo" src="assets/images/80logo.webp" alt="동아대학교 80주년" />
    </div>
    <nav class="nav">
      <a href="catalog.html">도서목록</a>
      <a href="status.html">신청 진행상황</a>
      <a href="guide.html">이용안내</a>
      <button type="button" data-cart-open><i class="fa-solid fa-cart-shopping"></i> 장바구니 <span id="navCartCount">0</span></button>
      <div class="auth-area" id="authArea"></div>
    </nav>
  </header>
  <main>
    <section class="login-hero">
      <div class="login-copy">
        <p class="eyebrow" data-setting="SITE_EYEBROW">Library Book Sharing</p>
        <h1 data-setting="SITE_TITLE">도서 나눔 플랫폼</h1>
        <p data-setting="SITE_DESCRIPTION">로그인 후 도서 신청과 진행상황 확인을 한 곳에서 관리할 수 있습니다.</p>
      </div>
      <form class="login-card" id="loginForm">
        <h2>학생/교직원 로그인</h2>
        <label>학번/직번<input name="studentId" required inputmode="numeric" autocomplete="username" /></label>
        <label>성명<input name="studentName" required autocomplete="name" /></label>
        <label>휴대폰번호<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" /></label>
        <div class="privacy-box">
          <strong>개인정보 수집 및 이용 안내</strong>
          <p>도서 신청 접수와 본인 신청내역 확인을 위해 학번/직번, 성명, 휴대폰번호, 신청 도서 정보가 수집되며 행사 운영 종료 후 내부 기준에 따라 보관 또는 삭제됩니다.</p>
          <label><input type="checkbox" name="privacyConsent" required /> 개인정보 수집 및 이용에 동의합니다.</label>
        </div>
        <button class="primary wide" type="submit">로그인하고 도서 보러가기</button>
      </form>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/js/app.js?v=20260907-4"></script>
</body>
</html>
