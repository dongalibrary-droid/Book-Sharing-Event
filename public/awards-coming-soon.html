<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>누구나 연구자 | 플로팅 버튼 샘플</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8fafb; color: #25343e; font-family: "Malgun Gothic", system-ui, sans-serif; letter-spacing: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .wrap { width: min(100%, 1080px); margin: auto; padding: 28px; }
    header { background: #fff; border-bottom: 1px solid #dce4e9; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { font-size: 21px; }
    .sample { color: #77838b; font-size: 12px; }
    .nav { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 24px; font-size: 14px; color: #526570; }
    main { min-height: 110vh; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 24px 0 28px; }
    h1 { margin: 0; font-size: 26px; }
    .replay { display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex-shrink: 0; min-height: 40px; padding: 8px 12px; border: 1px solid #cdd8df; border-radius: 6px; color: #354c5b; background: white; font: inherit; font-size: 13px; cursor: pointer; }
    .replay:hover { background: #eef4f7; }
    .replay span { font-size: 21px; line-height: 1; }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; border-top: 2px solid #365b6d; }
    section { padding: 24px 0; }
    h2 { margin: 0 0 16px; font-size: 18px; }
    .notice { padding: 16px 0; border-bottom: 1px solid #dce4e9; font-size: 15px; line-height: 1.7; }
    .notice small { display: block; color: #77838b; font-size: 12px; }
    footer { border-top: 1px solid #dce4e9; color: #77838b; font-size: 12px; }
    .floating { position: fixed; left: 24px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 100; width: 164px; text-align: center; }
    .floating-preview { display: grid; justify-items: center; gap: 0; color: #493024; cursor: default; text-decoration: none; }
    .floating-preview[href] { cursor: pointer; }
    .media { position: relative; display: block; width: 140px; height: 140px; isolation: isolate; }
    .media img, .media video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .media img { position: relative; z-index: 1; opacity: 1; transition: opacity .7s ease; filter: drop-shadow(0 0 4px rgba(215, 174, 108, .7)); animation: trophy-glow 2.8s ease-in-out infinite; }
    .media.is-playing img { opacity: 0; transition: none; animation: none; filter: none; }
    .media video { position: absolute; inset: 0; border-radius: 8px; filter: drop-shadow(0 0 1px #d8ad8c99) drop-shadow(0 0 4px #f1d0ad66) drop-shadow(0 3px 7px #bd8b7133); opacity: 0; transition: opacity .7s ease; pointer-events: none; }
    .media video.playing { opacity: 1; transition: none; }
    /* Apply the halo directly to the alpha silhouette; no masked or hidden layer. */
    @keyframes trophy-glow {
      0%, 100% { filter: drop-shadow(0 0 2.5px rgba(215, 174, 108, .55)); }
      50% { filter: drop-shadow(0 0 9px rgba(215, 174, 108, 1)); }
    }
    .label { width: 164px; padding: 8px 4px; border: 1px solid #c9a85280; border-radius: 6px; background: #fffffff0; box-shadow: 0 3px 12px #49302412; }
    .label small { display: block; font-size: 11px; font-weight: 700; line-height: 1.6; white-space: nowrap; }
    .label strong { display: block; margin-top: 3px; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.4; color: #784b3d; white-space: nowrap; }
    :is(a, button):focus-visible { outline: 3px solid #247fa5; outline-offset: 5px; }
    @media (max-width: 600px) {
      .wrap { padding: 22px; }
      .brand { font-size: 18px; }
      .nav { gap: 16px; font-size: 12px; }
      h1 { font-size: 22px; }
      .columns { grid-template-columns: 1fr; gap: 0; }
      .floating { left: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); width: 150px; }
      .media { width: 116px; height: 116px; }
      .label { width: 150px; padding: 6px 3px; }
      .label small { font-size: 10px; }
      .label strong { font-size: 17px; }
    }
    @media (prefers-reduced-motion: reduce) { .media img, .media video { transition: none; } }
    @media (prefers-reduced-motion: reduce) { .media img { animation: none; } }
    .trophy-sheen { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .media .trophy-sheen img { position: static; width: 100%; height: 100%; opacity: 1; animation: none; transition: none; filter: brightness(1.65) saturate(.65); }
    .trophy-sheen.idle-sheen { animation: idle-sheen 4.6s ease-in-out infinite; }
    .media.is-playing .idle-sheen { display: none; }
    @keyframes idle-sheen {
      0% { clip-path: polygon(-50% 0, -25% 0, -50% 100%, -75% 100%); opacity: 0; }
      15% { clip-path: polygon(25% 0, 50% 0, 25% 100%, 0% 100%); opacity: .6; }
      32% { clip-path: polygon(95% 0, 120% 0, 95% 100%, 70% 100%); opacity: .6; }
      48%, 100% { clip-path: polygon(150% 0, 175% 0, 150% 100%, 125% 100%); opacity: 0; }
    }
    .media.is-celebrating .idle-sheen { visibility: hidden; animation-play-state: paused; }
    .media.is-celebrating > img { animation-play-state: paused; }
    .media.is-celebrating::after { content: ""; position: absolute; inset: 4%; border: 1px solid #d9b777; border-radius: 50%; pointer-events: none; animation: hover-halo 1.2s ease-out both; }
    @keyframes hover-halo {
      0% { transform: scale(.86); opacity: 0; }
      25% { opacity: .7; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .floating-preview.is-celebrating .label { border-color: #b48b49; background: #fffaf0; box-shadow: 0 4px 18px #c59b4b35; }
    @media (prefers-reduced-motion: reduce) { .idle-sheen { display: none; } .media.is-celebrating::after { display: none; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <div class="top"><strong class="brand">동아대학교 도서관</strong><span class="sample">SAMPLE</span></div>
    <div class="nav"><span>자료검색</span><span>도서관 이용</span><span>연구·학습지원</span><span>도서관 소식</span></div>
  </div></header>
  <main class="wrap">
    <div class="heading"><h1>도서관 소식</h1><button type="button" class="replay" id="replay" title="플로팅 버튼 영상 다시 재생"><span aria-hidden="true">&#8635;</span>다시 재생</button></div>
    <div class="columns">
      <section><h2>공지사항</h2><div class="notice">누구나 연구자 경진대회 결과발표<small>연구·학습지원</small></div><div class="notice">도서관 이용 안내<small>도서관 서비스</small></div><div class="notice">온라인 이용교육<small>교육 안내</small></div></section>
      <section><h2>연구·학습지원</h2><div class="notice">학술자료 검색<small>논문과 학술정보 찾기</small></div><div class="notice">LMS 교육<small>온라인 학습</small></div><div class="notice">연구 상담<small>도서관 연구지원</small></div></section>
    </div>
  </main>
  <footer><div class="wrap">DONG-A UNIVERSITY LIBRARY</div></footer>
  <aside class="floating" aria-label="누구나 연구자 경진대회">
    <a class="floating-preview" id="awards-link" target="_blank" rel="noopener noreferrer">
      <span class="media" id="media">
        <img src="trophy-video-last-frame.png" alt="" width="140" height="140">
        <span class="trophy-sheen idle-sheen" aria-hidden="true"><img src="trophy-video-last-frame.png" alt=""></span>
      </span>
      <span class="label"><small>누구나 연구자 경진대회</small><strong id="awards-label"><time datetime="2026-10-29">10월 29일</time> 공개</strong></span>
    </a>
  </aside>
  <script>
    const releaseAt = Date.parse('2026-10-29T10:00:00+09:00');
    const resultUrl = 'https://dongalib1946.github.io/EveryResearcher/index.html';
    let releaseTimer;
    function updateRelease() {
      clearTimeout(releaseTimer);
      const remaining = releaseAt - Date.now();
      if (remaining <= 0) {
        document.getElementById('awards-label').textContent = '수상 결과 확인';
        const link = document.getElementById('awards-link');
        link.href = resultUrl;
        link.setAttribute('aria-label', '누구나 연구자 경진대회 수상 결과 확인');
      } else {
        // Use total hours so a countdown longer than one day does not wrap at 24.
        const secondsLeft = Math.ceil(remaining / 1000);
        const hours = String(Math.floor(secondsLeft / 3600)).padStart(2, '0');
        const minutes = String(Math.floor(secondsLeft / 60) % 60).padStart(2, '0');
        const seconds = String(secondsLeft % 60).padStart(2, '0');
        document.getElementById('awards-label').textContent = `${hours}:${minutes}:${seconds} 후 공개`;
        const link = document.getElementById('awards-link');
        link.removeAttribute('href');
        link.removeAttribute('aria-label');
        // Recompute from the clock on every tick, including after a suspended tab resumes.
        releaseTimer = setTimeout(updateRelease, remaining % 1000 || 1000);
      }
    }
    document.addEventListener('visibilitychange', updateRelease);
    window.addEventListener('pageshow', updateRelease);
    updateRelease();

    const media = document.getElementById('media');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let cleanup = () => {};

    // iOS browsers use WebKit too. Desktop Chromium must keep the WebM alpha path.
    function usesAppleVideo() {
      const ua = navigator.userAgent;
      const ios = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return ios || (/Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|Android/.test(ua));
    }

    function playIntro(explicit = false) {
      cleanup();
      if (reducedMotion.matches && !explicit) return;
      const video = document.createElement('video');
      let timer, removeTimer, finished = false, disposed = false;
      video.muted = true;
      video.defaultMuted = true;
      video.playsInline = true;
      video.preload = 'auto';
      video.setAttribute('aria-hidden', 'true');
      video.setAttribute('disablepictureinpicture', '');
      video.tabIndex = -1;
      const appleVideo = usesAppleVideo();
      // Unsupported Apple devices keep the transparent poster instead of a black video.
      if (appleVideo && !video.canPlayType('video/quicktime; codecs="hvc1"') &&
          !video.canPlayType('video/mp4; codecs="hvc1"')) return;
      video.src = appleVideo ? 'intro-transparent-hevc.mov' : 'intro-transparent.webm';
      const dispose = () => {
        disposed = true;
        clearTimeout(timer);
        clearTimeout(removeTimer);
        media.classList.remove('is-playing');
        video.pause();
        video.removeAttribute('src');
        video.load();
        video.remove();
      };
      cleanup = dispose;
      const finish = () => {
        if (finished || disposed) return;
        finished = true;
        clearTimeout(timer);
        // Keep the last video frame mounted while it fades over the static image.
        video.classList.remove('playing');
        media.classList.remove('is-playing');
        removeTimer = setTimeout(dispose, reducedMotion.matches ? 0 : 750);
      };
      const watchdog = () => {
        if (finished || disposed) return;
        clearTimeout(timer);
        timer = setTimeout(finish, 12000);
      };
      video.addEventListener('playing', () => {
        if (!finished && !disposed) {
          video.classList.add('playing');
          media.classList.add('is-playing');
        }
        watchdog();
      });
      video.addEventListener('timeupdate', watchdog);
      video.addEventListener('ended', finish);
      video.addEventListener('error', finish);
      media.append(video);
      watchdog();
      video.play().catch(finish);
    }
    document.getElementById('replay').addEventListener('click', () => playIntro(true));
    reducedMotion.addEventListener('change', () => { if (reducedMotion.matches) cleanup(); });
    window.addEventListener('pagehide', () => cleanup());
    playIntro();
    const awardsLink = document.getElementById('awards-link');
    let celebrating = false;
    let effectTimer;
    let effects = [];
    function resetCelebration() {
      clearTimeout(effectTimer);
      effects.forEach(effect => effect.cancel());
      effects = [];
      celebrating = false;
      media.classList.remove('is-celebrating');
      awardsLink.classList.remove('is-celebrating');
    }
    function celebrate() {
      if (!awardsLink.hasAttribute('href') || celebrating) return;
      celebrating = true;
      if (media.querySelector('video')) { cleanup(); cleanup = () => {}; }
      media.classList.add('is-celebrating');
      awardsLink.classList.add('is-celebrating');
      const motion = !reducedMotion.matches && typeof media.animate === 'function';
      if (motion) {
        effects.push(media.animate([
          { transform: 'translateY(0) scale(1)' },
          { transform: 'translateY(-5px) scale(1.045)', offset: .4 },
          { transform: 'translateY(-5px) scale(1.045)', offset: .65 },
          { transform: 'translateY(0) scale(1)' }
        ], { duration: 850, easing: 'ease-in-out' }));

      }
      effectTimer = setTimeout(() => {
        resetCelebration();
      }, motion ? 1250 : 700);
    }
    awardsLink.addEventListener('pointerenter', event => {
      if (event.pointerType === 'mouse' || event.pointerType === 'pen') celebrate();
    });
    awardsLink.addEventListener('focus', celebrate);
    awardsLink.addEventListener('click', event => {
      if (!awardsLink.hasAttribute('href')) return;
      // Navigation stays native and immediate, even while the hover effect runs.
      celebrate();
    });
    reducedMotion.addEventListener('change', resetCelebration);
    window.addEventListener('pagehide', resetCelebration);

  </script>
</body>
</html>
